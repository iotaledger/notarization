[advisories]
ignore = [
  "RUSTSEC-2023-0071", # temporary ignore until fix is provided
  "RUSTSEC-2024-0437", # protobuf uncontrolled recursion https://github.com/iotaledger/iota/issues/5861
  "RUSTSEC-2026-0194", # should be fixed by next IOTA version
  "RUSTSEC-2026-0195", # should be fixed by next IOTA version
  # crypto-bigint 0.5 timing side channels, fixed only in >=0.7.6. Comes in through elliptic-curve 0.13
  # (fastcrypto, iota-sdk-crypto), which has no patched release. Affects client-side secp256k1 and
  # secp256r1 signing. Also ignored upstream in iota and iota-rust-sdk. Remove once fastcrypto moves to
  # elliptic-curve 0.14. See #350.
  "RUSTSEC-2026-0387",
]
