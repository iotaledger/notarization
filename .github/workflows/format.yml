name: Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/**"

    paths:
      - ".github/workflows/format.yml"
      - "**.rs"
      - "**.toml"
      - "**.ts"
      - "**.js"
      - "**.json"

jobs:
  format:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v3

      # we use nightly to get access to advanced format capabilities
      - name: Setup Rust
        uses: "./.github/actions/rust/setup"
        with:
          toolchain: nightly
          os: ${{ runner.os }}
          job: ${{ github.job }}
          components: rustfmt

      - name: Install cargo-license-template
        # Since Rust 1.100, cargo install uses the packaged Cargo.lock (rust-lang/cargo#17388). The one in
        # cargo-license-template 0.1.3 (2022) pins regex 1.5, which rejects `\/` in .license_template, and a
        # cargo_metadata that rejects edition 2024. Install without it, so dependencies resolve as before.
        run: |
          curl -sSfL https://static.crates.io/crates/cargo-license-template/cargo-license-template-0.1.3.crate | tar xz -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/cargo-license-template-0.1.3/Cargo.lock"
          cargo +stable install --path "$RUNNER_TEMP/cargo-license-template-0.1.3"

      - name: Install dprint
        run: npm install -g dprint

      - name: core fmt check
        run: cargo +nightly fmt --all -- --check

      - name: wasm fmt check notarization_wasm
        run: cargo +nightly fmt --manifest-path ./bindings/wasm/notarization_wasm/Cargo.toml --all -- --check

      - name: wasm fmt check audit_trail_wasm
        run: cargo +nightly fmt --manifest-path ./bindings/wasm/audit_trail_wasm/Cargo.toml --all -- --check

      - name: wasm fmt check poi_wasm
        run: cargo +nightly fmt --manifest-path ./bindings/wasm/poi_wasm/Cargo.toml --all -- --check

      - name: fmt check with dprint
        run: dprint check

      - name: cargo-license-template check
        run: cargo +nightly license-template --template .license_template --ignore .license_template_ignore --verbose

      - name: Use Node.js
        uses: actions/setup-node@v4

      - name: Install prettier-plugin-move
        run: npm i @mysten/prettier-plugin-move

      - name: prettier-move check notarization-move
        working-directory: notarization-move
        run: npx prettier-move -c **/*.move

      - name: prettier-move check audit-trail-move
        working-directory: audit-trail-move
        run: npx prettier-move -c **/*.move
