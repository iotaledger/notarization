name: Audit

on:
  schedule:
    - cron: "0 0 * * *" # run at midnight every day
  push:
    branches:
      - main
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/audit.yml"
      - ".cargo/audit.toml"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "support/**"
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/audit.yml"
      - ".cargo/audit.toml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # poi-rs is its own workspace with its own lockfile. Runs from the repository root so
      # .cargo/audit.toml applies.
      - name: Audit the Proof of Inclusion lockfile
        run: |
          cargo install cargo-audit --locked
          cargo audit --file poi-rs/Cargo.lock
