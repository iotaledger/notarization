name: "rust-setup"
description: "Prepares a rust environment and relevant caches."
inputs:
  target:
    description: "Additionally install specified target for this toolchain, ex. x86_64-apple-darwin"
    required: false
  toolchain:
    description: "Rust toolchain to install and use. Default: current stable."
    required: false
    default: stable
  update-dependencies:
    description: "Resolve newer dependencies for scheduled compatibility checks."
    required: false
    default: "false"
  components:
    description: "Comma-separated string of additional components to install e.g. `clippy`, `rustfmt`"
    required: false
  os:
    description: "OS of the runner, used for cache key construction."
    required: true
  job:
    description: "Name of the job, used for cache key construction."
    required: true
  cargo-cache-enabled:
    description: "Cache cargo folder. Default: false."
    required: false
    default: ""
  target-cache-enabled:
    description: "Cache build artifacts from the target path. Default: false."
    required: false
    default: ""
  target-cache-path:
    description: "Path of the target cache."
    required: false
    default: target
  sccache-enabled:
    description: "Install and use sccache. Default: false."
    required: false
    default: ""
  sccache-path:
    description: 'The sccache directory. E.g. "/home/runner/.cache/sccache"'
    required: false
runs:
  using: "composite"
  steps:
    - name: Setup rust toolchain
      id: rust-toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        TARGET: ${{ inputs.target }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        args=("$TOOLCHAIN" --profile minimal --no-self-update)
        if [[ -n "$TARGET" ]]; then
          args+=(--target "$TARGET")
        fi
        if [[ -n "$COMPONENTS" ]]; then
          args+=(--component "$COMPONENTS")
        fi
        rustup toolchain install "${args[@]}"

        # Select this toolchain for subsequent steps, including nested WASM packages.
        echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
        compiler=$(RUSTUP_TOOLCHAIN="$TOOLCHAIN" rustc --version)
        echo "$compiler"
        echo "cache-key=${compiler// /-}" >> "$GITHUB_OUTPUT"
        RUSTUP_TOOLCHAIN="$TOOLCHAIN" cargo --version

    # Resolve new versions only for compatibility runs, before computing cache keys.
    - name: Update dependencies
      if: inputs.update-dependencies == 'true'
      run: cargo update
      shell: bash

    - name: Cache cargo
      uses: actions/cache@v4
      if: inputs.cargo-cache-enabled == 'true'
      with:
        # https://doc.rust-lang.org/cargo/guide/cargo-home.html#caching-the-cargo-home-in-ci
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        # Refresh when resolved dependencies change
        key: ${{ inputs.os }}-cargo-${{ inputs.job }}-${{ hashFiles('**/Cargo.lock') }}
        # Restore from outdated cache for speed
        restore-keys: |
          ${{ inputs.os }}-cargo-${{ inputs.job }}-
          ${{ inputs.os }}-cargo-

    - name: Cache build target
      uses: actions/cache@v4
      if: inputs.target-cache-enabled == 'true'
      with:
        path: ${{ inputs.target-cache-path }}
        key: ${{ inputs.os }}-target-${{ steps.rust-toolchain.outputs.cache-key }}-${{ inputs.job }}-${{ hashFiles('**/Cargo.lock') }}
        # Restore from outdated cache for speed
        restore-keys: |
          ${{ inputs.os }}-target-${{ steps.rust-toolchain.outputs.cache-key }}-${{ inputs.job }}-
          ${{ inputs.os }}-target-${{ steps.rust-toolchain.outputs.cache-key }}-

    - name: Cache sccache
      uses: actions/cache@v4
      if: inputs.sccache-enabled == 'true'
      with:
        path: ${{ inputs.sccache-path }}
        key: ${{ inputs.os }}-sccache-${{ steps.rust-toolchain.outputs.cache-key }}-${{ inputs.job }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ inputs.os }}-sccache-${{ steps.rust-toolchain.outputs.cache-key }}-${{ inputs.job }}-
          ${{ inputs.os }}-sccache-${{ steps.rust-toolchain.outputs.cache-key }}-
