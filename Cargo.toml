[workspace.package]
authors = ["IOTA Stiftung"]
edition = "2024"
homepage = "https://www.iota.org"
license = "Apache-2.0"
repository = "https://github.com/iotaledger/notarization"
rust-version = "1.85"

[workspace]
resolver = "2"
members = ["audit-trail-rs", "examples", "examples/poi", "notarization-rs", "poi-rs"]
exclude = [
  "bindings/wasm/notarization_wasm",
  "bindings/wasm/audit_trail_wasm",
  "bindings/wasm/poi_wasm",
]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bcs = "0.1"
chrono = { version = "0.4", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
hyper = "1"
iota-grpc-client = { git = "https://github.com/iotaledger/iota-rust-sdk.git", package = "iota-sdk-grpc-client", rev = "2f021d0556e47564e9b04bcd0b3e8347c41a0a26" }
iota-grpc-types = { git = "https://github.com/iotaledger/iota-rust-sdk.git", package = "iota-sdk-grpc-types", rev = "2f021d0556e47564e9b04bcd0b3e8347c41a0a26" }
iota-sdk = { git = "https://github.com/iotaledger/iota.git", package = "iota-sdk", tag = "v1.29.0" }
iota-sdk-types = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "2f021d0556e47564e9b04bcd0b3e8347c41a0a26", default-features = false }
iota-types = { git = "https://github.com/iotaledger/iota.git", tag = "v1.29.0" }
iota_interaction = { git = "https://github.com/iotaledger/product-core.git", tag = "v0.8.24", default-features = false, package = "iota_interaction" }
iota_interaction_rust = { git = "https://github.com/iotaledger/product-core.git", tag = "v0.8.24", default-features = false, package = "iota_interaction_rust" }
iota_interaction_ts = { git = "https://github.com/iotaledger/product-core.git", tag = "v0.8.24", default-features = false, package = "iota_interaction_ts" }
product_common = { git = "https://github.com/iotaledger/product-core.git", tag = "v0.8.24", default-features = false, package = "product_common" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
secret-storage = { git = "https://github.com/iotaledger/secret-storage.git", tag = "v0.3.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde-aux = { version = "4.7.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
sha2 = { version = "0.10", default-features = false }
strum = { version = "0.27", default-features = false, features = ["std", "derive"] }
tempfile = "3.27.0"
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.52.2", default-features = false, features = ["macros", "sync", "rt", "process"] }

[patch."https://github.com/MystenLabs/fastcrypto"]
fastcrypto = "=0.1.11"

[profile.release.package.iota_interaction_ts]
opt-level = 's'
