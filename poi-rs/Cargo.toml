[package]
name = "poi-rs"
version = "0.1.0-alpha"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = ["iota", "proof", "inclusion", "notarization"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Proof of Inclusion support for the IOTA Notarization Toolkit."

[features]
default = ["native-grpc"]
native-grpc = ["dep:iota-grpc-client", "dep:iota-grpc-types"]
cli = [
  "native-grpc",
  "dep:anyhow",
  "dep:clap",
  "dep:iota-config",
  "dep:reqwest",
  "serde_json/std",
  "tokio/macros",
  "tokio/process",
  "tokio/rt",
]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait.workspace = true
bcs.workspace = true
clap = { workspace = true, optional = true }
iota-config = { git = "https://github.com/iotaledger/iota.git", tag = "v1.29.0", optional = true }
iota-grpc-client = { workspace = true, optional = true }
iota-grpc-types = { workspace = true, optional = true }
iota-sdk-types.workspace = true
iota-types.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["alloc"] }
thiserror.workspace = true
tokio = { version = "1.52.2", default-features = false, features = ["sync"] }

[dev-dependencies]
iota-config = { git = "https://github.com/iotaledger/iota.git", tag = "v1.29.0" }
test-cluster = { git = "https://github.com/iotaledger/iota.git", tag = "v1.29.0", package = "test-cluster" }
tokio = { version = "1.52.2", default-features = false, features = ["macros", "process", "rt", "sync"] }

[[bin]]
name = "poi"
path = "src/bin/poi.rs"
required-features = ["cli"]
