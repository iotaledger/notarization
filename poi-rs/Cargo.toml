[package]
name = "poi-rs"
version = "0.1.0-alpha"
authors = ["IOTA Stiftung"]
edition = "2024"
homepage = "https://www.iota.org"
keywords = ["iota", "proof", "inclusion", "notarization"]
license = "Apache-2.0"
repository = "https://github.com/iotaledger/notarization"
rust-version = "1.85"
description = "Proof of Inclusion support for the IOTA Notarization Toolkit."

# Proof of Inclusion is its own workspace so it can follow IOTA node and SDK releases independently
# of the other Notarization Toolkit components, which share the root workspace and product-core.
[workspace]

[features]
default = ["native-grpc"]
native-grpc = ["dep:iota-grpc-client", "dep:iota-grpc-types"]
cli = [
  "native-grpc",
  "dep:anyhow",
  "dep:clap",
  "dep:iota-config",
  "dep:reqwest",
  "serde_json/std",
  "tokio/macros",
  "tokio/process",
  "tokio/rt",
]

[dependencies]
anyhow = { version = "1.0", optional = true }
async-trait = "0.1"
bcs = "0.1"
clap = { version = "4.6.1", features = ["derive"], optional = true }
iota-config = { git = "https://github.com/iotaledger/iota.git", tag = "v1.35.2", optional = true }
iota-grpc-client = { version = "1.0.0-rc.2", package = "iota-sdk-grpc-client", optional = true }
iota-grpc-types = { version = "1.0.0-rc.1", package = "iota-sdk-grpc-types", optional = true }
iota-sdk-types = { version = "1.0.0-rc.2", default-features = false }
iota-types = { git = "https://github.com/iotaledger/iota.git", tag = "v1.35.2" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.52.2", default-features = false, features = ["sync"] }

[dev-dependencies]
iota-config = { git = "https://github.com/iotaledger/iota.git", tag = "v1.35.2" }
test-cluster = { git = "https://github.com/iotaledger/iota.git", tag = "v1.35.2", package = "test-cluster" }
tokio = { version = "1.52.2", default-features = false, features = ["macros", "process", "rt", "sync"] }

[patch."https://github.com/MystenLabs/fastcrypto"]
fastcrypto = "=0.1.11"

[[bin]]
name = "poi"
path = "src/bin/poi.rs"
required-features = ["cli"]
